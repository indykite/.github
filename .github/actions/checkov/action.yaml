---
#
# DO NOT EDIT!!!
# Managed by GitHub Actions
#
name: checkov
description: Runs Checkov IaC security scanner

runs:
  using: composite
  steps:
    - name: actions/git-checkout
      uses: indykite/.github/.github/actions/git-checkout@master # actions/checkout with dynamic fetch-depth resolution

    - name: detect checkov config
      id: checkov_config
      shell: bash
      run: |
        config_path=""
        if [[ -f ".checkov.yml" ]]; then
          config_path=".checkov.yml"
        elif [[ -f ".checkov.yaml" ]]; then
          config_path=".checkov.yaml"
        fi

        if [[ -n "${config_path}" ]]; then
          echo "path=${config_path}" >> "${GITHUB_OUTPUT}"
          echo "Detected Checkov config file: ${config_path}"
        else
          echo "No Checkov config file found (.checkov.ya?ml); Checkov step will be skipped."
        fi

    - name: checkov
      if: steps.checkov_config.outputs.path
      uses: bridgecrewio/checkov-action@9b70310bcd306d11740313070b940167d6b23085 # v12.3115.0 - https://github.com/bridgecrewio/checkov-action/releases
      with:
        config_file: ${{ steps.checkov_config.outputs.path }}
        output_format: cli
        output_file_path: checkov-results.txt,

    - name: checkov/summary
      if: always() && steps.checkov_config.outputs.path
      shell: bash
      run: |-
        set -euo pipefail

        OUTPUT_FILE="checkov-summary.txt"
        SOURCE_FILE="checkov-results.txt"

        if [[ ! -f "${SOURCE_FILE}" ]]; then
          printf '%s\n' "checkov output file not found" > "${OUTPUT_FILE}"
          exit 0
        fi

        awk '
          /^[[:space:]]*[A-Za-z0-9_ -]+ scan results:[[:space:]]*$/ {
            print $0
            while (getline > 0) {
              if ($0 ~ /^[[:space:]]*Passed checks:/) {
                print $0
                print ""
                break
              }
            }
          }
        ' "${SOURCE_FILE}" > "${OUTPUT_FILE}" || true

        if [[ ! -s "${OUTPUT_FILE}" ]]; then
          printf '%s\n' "no checkov summary lines found" > "${OUTPUT_FILE}"
        fi
