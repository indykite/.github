---
#
# DO NOT EDIT!!!
# Managed by GitHub Actions
#
# Prerequisites:
#   - the following permissions in the workflow using this action:
#     - 'permissions.actions: read' to access '.../actions/artifacts' API
#     - 'permissions.pull-requests: write'
#
name: artifact-to-comment
description: Add artifact link to PR comment

inputs:
  artifact-name:
    description: Workflow artifact name
    required: true
  artifact-title:
    description: Human-readable artifact title
    required: true

runs:
  using: composite
  steps:
    - name: Get Artifact URL & PR Info
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        OWNER: ${{ github.repository_owner }}
        REPO: ${{ github.event.repository.name }}
        WORKFLOW_RUN_EVENT_OBJ: ${{ toJSON(github.event.workflow_run) }}
      # https://docs.github.com/en/rest/actions/artifacts?apiVersion=2022-11-28
      run: |
        PREVIOUS_JOB_ID=$(jq -r '.id' <<< "$WORKFLOW_RUN_EVENT_OBJ")
        echo "Previous Job ID: $PREVIOUS_JOB_ID"
        echo "PREVIOUS_JOB_ID=$PREVIOUS_JOB_ID" >> "$GITHUB_ENV"

        SUITE_ID=$(jq -r '.check_suite_id' <<< "$WORKFLOW_RUN_EVENT_OBJ")
        echo "Previous Suite ID: $SUITE_ID"
        echo "SUITE_ID=$SUITE_ID" >> "$GITHUB_ENV"

        ARTIFACT_ID=$(gh api -X GET "/repos/$OWNER/$REPO/actions/artifacts" -f name="${{ inputs.artifact-name }}"\
          --jq ".artifacts.[] |
          select(.workflow_run.id==${PREVIOUS_JOB_ID}) |
          select(.expired==false) |
          .id")

        echo "Artifact ID: $ARTIFACT_ID"
        echo "ARTIFACT_ID=$ARTIFACT_ID" >> "$GITHUB_ENV"

        PR_NUMBER=$(jq -r '.pull_requests[0].number' \
          <<< "$WORKFLOW_RUN_EVENT_OBJ")

        echo "PR Number: $PR_NUMBER"
        echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"

        HEAD_SHA=$(jq -r '.pull_requests[0].head.sha' \
          <<< "$WORKFLOW_RUN_EVENT_OBJ")

        echo "Head SHA: $HEAD_SHA"
        echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"

    - name: Find Comment
      uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0 - https://github.com/peter-evans/find-comment/releases
      id: find-comment
      with:
        issue-number: ${{ env.PR_NUMBER }}
        comment-author: "github-actions[bot]"
        body-includes: "<!-- artifact:${{ inputs.artifact-name }} -->"

    - name: Create or update Comment
      uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0 - https://github.com/peter-evans/create-or-update-comment/
      env:
        JOB_PATH: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ env.PREVIOUS_JOB_ID }}"
        ARTIFACT_URL: "${{ github.server_url }}/${{ github.repository }}/suites/${{ env.SUITE_ID }}/artifacts/${{ env.ARTIFACT_ID }}"
        HEAD_SHA: "${{ env.HEAD_SHA }}"
      with:
        issue-number: ${{ env.PR_NUMBER }}
        comment-id: ${{ steps.find-comment.outputs.comment-id }}
        edit-mode: replace
        body: |-
          <!-- artifact:${{ inputs.artifact-name }} -->
          ## ${{ inputs.artifact-title }}

          Zip-archived ${{ inputs.artifact-title }} can be found below.

          Please note that files only stay for around 90 days!

          **[Download ${{ inputs.artifact-title }}](${{ env. ARTIFACT_URL }})** for commit: ${{ env.HEAD_SHA }}

          Check [Build details](${{ env.JOB_PATH }}) for troubleshooting.
