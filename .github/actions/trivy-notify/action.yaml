---
#
# DO NOT EDIT!!!
# Managed by GitHub Actions
#
# Scheduled trivy vulnerability notifications (Slack + Jira).
#
# Intended caller: the 'trivy' composite action already ran (produced 'trivy-results.json' in
# the workspace) with a repo-wide (non diff-filtered) scan, i.e. on a 'schedule' (or 'push' to
# the default branch) trigger -- never on 'pull_request' (see 'trivy/action.yaml' failure
# policy: vulnerabilities never block a PR, they are only surfaced here).
#
# "New" vulnerability = any entry present in the normal 'Results[].Vulnerabilities' of a scan
# run with 'ignorefile: .trivyignore.yaml' configured (see repo '.trivy.yaml'): trivy itself
# already excludes anything listed there, so nothing extra needs to be tracked/diffed here.
#
# On any new vulnerability: create a Jira issue through the Jira Cloud REST API using the
# dedicated service-account token, then append an ignore-file entry per CVE (statement includes
# the returned Jira issue key, a UTC timestamp, and the run URL -- see 'apply-ignorefile.sh') and
# open a PR from a dedicated bot branch. Auto-merge is enabled, but GitHub merges only after the
# repository's required checks pass. A human removes the entry manually once the CVE is actually
# resolved or permanently accepted. The Slack summary is posted independently of the Jira call's
# outcome (a Jira/Slack outage never fails the scan).
#
# The caller passes the non-secret App client ID and organization-visible private key. This action mints
# a repo-scoped installation token only after a Jira-confirmed CVE is found, so the resulting PR
# triggers the repository's required checks without minting a token on routine scans.
#
# Per-repo Slack channel/mention and Jira project/team/labels are read from the calling repo's
# own '.trivy.yaml', under a 'notify:' key that trivy itself ignores (verified: unknown
# top-level config keys do not affect trivy's own parsing). Falls back to the org-wide defaults
# (see 'script.sh') when the repo has no 'notify:' section (or a sub-key is absent).
#
name: trivy-notify
description: Posts Slack + Jira notifications for new Trivy vulnerabilities found on a scheduled/push scan.

inputs:
  slack-bot-token:
    description: >-
      Slack bot token (chat.postMessage), e.g. secrets.SLACK_BOT_TOKEN. Composite actions
      cannot read the 'secrets' context directly, so the caller must pass this explicitly.
    required: true
  jira-api-token:
    description: >-
      Jira Cloud API token for the dedicated Trivy service account, e.g. secrets.JIRA_API_TOKEN.
      The token must have Jira issue creation permission in the configured project.
    required: true
  github-app-client-id:
    description: Non-secret ik-code-writer App client ID.
    required: false
    default: ''
  github-app-private-key:
    description: Organization-visible ik-code-writer App private key; handle as a secret.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: trivy-notify/find-new-cves
      id: find
      shell: bash
      env:
        # org-wide defaults, used when the repo's '.trivy.yaml' has no 'notify:' override.
        # Literal, not 'vars.*': composite actions can't reference the 'vars' context (same
        # restriction as 'secrets') -- confirmed at runtime: "Unrecognized named-value: 'vars'".
        DEFAULT_SLACK_CHANNEL: '#ops-notifications'
        DEFAULT_SLACK_MENTION: '@dev-sec-ops'
        DEFAULT_JIRA_PROJECT: 'ENG'
        DEFAULT_JIRA_TEAM: 'DSO'
        DEFAULT_JIRA_LABELS: 'secops'
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        RUN_ID: ${{ github.run_id }}
        REPO: ${{ github.repository }}
      run: ${{ github.action_path }}/script.sh

    - name: trivy-notify/jira-create
      id: jira_create
      if: ${{ steps.find.outputs.new_count > 0 }}
      continue-on-error: true # a Jira outage must never fail the scheduled scan (falls back below)
      shell: bash
      env:
        JIRA_API_TOKEN: ${{ inputs.jira-api-token }}
        JIRA_PAYLOAD: ${{ steps.find.outputs.jira_payload }}
      run: |-
        set -euo pipefail

        API_URL="https://api.atlassian.com/ex/jira/b5e52b9c-3a24-41f6-bf37-38d31606410e/rest/api/3/issue"
        CREATE_PAYLOAD="$(jq -c '{fields: .fields}' <<<"${JIRA_PAYLOAD}")"
        RESPONSE="$(curl -sS -w '\n%{http_code}' \
          -X POST \
          -H "Authorization: Bearer ${JIRA_API_TOKEN}" \
          -H 'Accept: application/json' \
          -H 'Content-Type: application/json' \
          -d "${CREATE_PAYLOAD}" \
          "${API_URL}")"

        HTTP_STATUS_CODE="$(printf '%s' "${RESPONSE}" | tail -n1)"
        HTTP_BODY="$(printf '%s' "${RESPONSE}" | sed '$d')"
        ISSUE_KEY="$(jq -r '.key // empty' <<<"${HTTP_BODY}" 2>/dev/null || true)"
        RESPONSE_BODY='{}'
        if [[ -n "${ISSUE_KEY}" ]]; then
          RESPONSE_BODY="$(jq -cn --arg issue_key "${ISSUE_KEY}" '{created: [{issue_key: $issue_key}]}')"
        fi

        {
          echo 'body<<JIRA_API_CREATE_EOF'
          echo "${RESPONSE_BODY}"
          echo 'JIRA_API_CREATE_EOF'
        } >>"${GITHUB_OUTPUT}"

        if [[ "${HTTP_STATUS_CODE}" != 2[0-9][0-9] || -z "${ISSUE_KEY}" ]]; then
          echo "Jira issue creation failed (HTTP/${HTTP_STATUS_CODE})" >&2
          echo "${HTTP_BODY}" >&2
          exit 1
        fi

    # ---- Runs after the Jira API call so the ignore-file statement can reference the actual
    #      created issue key (see 'apply-ignorefile.sh' for the response contract). 'always()':
    #      Slack still reports the alert if Jira is unavailable, while CVEs remain unsuppressed
    #      without an issue key. ----
    - name: trivy-notify/apply-ignorefile
      id: apply_ignorefile
      if: ${{ always() && steps.find.outputs.new_count > 0 }}
      shell: bash
      env:
        IGNOREFILE: ${{ steps.find.outputs.ignorefile }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        JIRA_PROJECT: ${{ steps.find.outputs.jira_project }}
        JIRA_TEAM: ${{ steps.find.outputs.jira_team }}
        SLACK_TEXT: ${{ steps.find.outputs.slack_text }}
        JIRA_RESPONSE_BODY: ${{ steps.jira_create.outputs.body }}
      run: ${{ github.action_path }}/apply-ignorefile.sh

    # 'always()': a Jira API failure must never suppress the Slack alert.
    - name: trivy-notify/slack-notify
      uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0 - https://github.com/slackapi/slack-github-action/releases
      if: ${{ always() && steps.find.outputs.new_count > 0 }}
      continue-on-error: true # a Slack outage must never fail the scheduled scan
      with:
        token: ${{ inputs.slack-bot-token }}
        method: chat.postMessage
        payload: |-
          {
            "channel": "${{ steps.find.outputs.slack_channel }}",
            "text": ${{ toJson(steps.apply_ignorefile.outputs.slack_text) }}
          }

    - name: trivy-notify/mint-github-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0 - https://github.com/actions/create-github-app-token/releases
      id: code_writer_token
      if: >-
        ${{ steps.apply_ignorefile.outputs.jira_confirmed == 'true' &&
        inputs.github-app-client-id != '' && inputs.github-app-private-key != '' }}
      continue-on-error: true
      with:
        client-id: ${{ inputs.github-app-client-id }}
        private-key: ${{ inputs.github-app-private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-contents: write
        permission-pull-requests: write

    - name: trivy-notify/warn-pr-token-unavailable
      if: ${{ steps.apply_ignorefile.outputs.jira_confirmed == 'true' && steps.code_writer_token.outputs.token == '' }}
      shell: bash
      run: echo "::warning::Could not mint an ik-code-writer token; Trivy suppressions were not opened as a PR"

    - name: trivy-notify/open-ignorefile-pr
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1 - https://github.com/peter-evans/create-pull-request/releases
      id: ignorefile_pr
      if: ${{ steps.code_writer_token.outputs.token != '' }}
      with:
        token: ${{ steps.code_writer_token.outputs.token }}
        branch: automation/trivy-ignorefile
        base: ${{ github.ref_name }}
        title: "ci: suppress ${{ steps.find.outputs.new_count }} new trivy CVE(s) pending remediation"
        body: |-
          Add temporary Trivy ignore entries for newly reported CVEs.

          Jira issue(s): ${{ steps.apply_ignorefile.outputs.created_issue_keys || 'not returned; see the workflow run' }}
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          The entries are tied to Jira issues and should be removed after remediation or formal risk acceptance.
        commit-message: "ci: suppress ${{ steps.find.outputs.new_count }} new trivy CVE(s) pending remediation"
        add-paths: |-
          ${{ steps.find.outputs.ignorefile }}
          .trivy.yaml
        delete-branch: true

    - name: trivy-notify/enable-auto-merge
      if: ${{ steps.ignorefile_pr.outputs.pull-request-number != '' }}
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ steps.code_writer_token.outputs.token }}
        PR_NUMBER: ${{ steps.ignorefile_pr.outputs.pull-request-number }}
        REPOSITORY: ${{ github.repository }}
      run: gh pr merge "${PR_NUMBER}" --auto --squash --repo "${REPOSITORY}"
