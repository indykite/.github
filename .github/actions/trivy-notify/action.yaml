---
#
# DO NOT EDIT!!!
# Managed by GitHub Actions
#
# Scheduled trivy vulnerability notifications (Slack + Jira).
#
# Intended caller: the 'trivy' composite action already ran (produced 'trivy-results.json' in
# the workspace) with a repo-wide (non diff-filtered) scan, i.e. on a 'schedule' (or 'push' to
# the default branch) trigger -- never on 'pull_request' (see 'trivy/action.yaml' failure
# policy: vulnerabilities never block a PR, they are only surfaced here).
# Enforced in 'script.sh': any run whose ref is not the default branch (PRs, feature-branch
# pushes, tags/releases) is skipped with 'new_count=0', so no Jira/PR/Slack step runs.
#
# "New" vulnerability = any entry present in the normal 'Results[].Vulnerabilities' of a scan
# run with 'ignorefile: .trivyignore.yaml' configured (see repo '.trivy.yaml'): trivy itself
# already excludes anything listed there, so nothing extra needs to be tracked/diffed here.
#
# On any new vulnerability: create a Jira issue through the Jira Cloud REST API using the
# dedicated service-account token, then append an ignore-file entry per CVE (statement includes
# the returned Jira issue key and a UTC timestamp -- see 'apply-ignorefile.sh') and
# open a PR from a dedicated bot branch. Auto-merge is requested only when enabled by the repo,
# and remains subject to required checks and approvals. A human removes the entry once the CVE is
# resolved or permanently accepted. The suppression PR and Slack summary are created independently
# of the Jira call's outcome; entries reference the workflow run when no Jira key is returned.
# Before creating a Jira issue, the action searches saved filter 11525 (open vulnerabilities) for
# an existing repo/package-version summary, regardless of the CVE count, and reuses that issue.
#
# The caller passes the non-secret App client ID and organization-visible private key. This action mints
# a repo-scoped installation token only after new CVE entries are generated, so the resulting PR
# triggers the repository's required checks without minting a token on routine scans.
#
# Per-repo Slack channel/mention and Jira project/team/labels are read from the calling repo's
# own '.trivy.yaml', under a 'notify:' key that trivy itself ignores (verified: unknown
# top-level config keys do not affect trivy's own parsing). Falls back to the org-wide defaults
# (see 'script.sh') when the repo has no 'notify:' section (or a sub-key is absent).
#
name: trivy-notify
description: Posts Slack + Jira notifications for new Trivy vulnerabilities found on a scheduled/push scan.

inputs:
  slack-bot-token:
    description: >-
      Slack bot token (chat.postMessage), e.g. secrets.SLACK_BOT_TOKEN. Composite actions
      cannot read the 'secrets' context directly, so the caller must pass this explicitly.
      If missing, Slack notifications are skipped with a warning.
    required: false
    default: ''
  jira-api-token:
    description: >-
      Jira Cloud API token for the dedicated Trivy service account, e.g. secrets.JIRA_API_TOKEN.
      The token must have Jira issue creation permission in the configured project.
    required: true
  jira-cloud-id:
    description: Jira Cloud ID from secrets.JIRA_CLOUD_ID.
    required: true
  jira-watchers:
    description: JSON array of Jira account IDs from secrets.TRIVY_JIRA_WATCHERS.
    required: false
    default: '[]'
  github-app-client-id:
    description: Non-secret ik-code-writer App client ID.
    required: false
    default: ''
  github-app-private-key:
    description: Organization-visible ik-code-writer App private key; handle as a secret.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: trivy-notify/find-new-cves
      id: find
      shell: bash
      env:
        # org-wide defaults, used when the repo's '.trivy.yaml' has no 'notify:' override.
        # Literal, not 'vars.*': composite actions can't reference the 'vars' context (same
        # restriction as 'secrets') -- confirmed at runtime: "Unrecognized named-value: 'vars'".
        DEFAULT_SLACK_CHANNEL: '#ops-notifications'
        DEFAULT_SLACK_MENTION: '@dev-sec-ops'
        DEFAULT_JIRA_PROJECT: 'ENG'
        DEFAULT_JIRA_TEAM: 'DSO'
        DEFAULT_JIRA_LABELS: 'secops'
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        RUN_ID: ${{ github.run_id }}
        REPO: ${{ github.repository }}
        EVENT_NAME: ${{ github.event_name }}
        GIT_REF: ${{ github.ref }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: ${{ github.action_path }}/script.sh

    - name: trivy-notify/jira-create
      id: jira_create
      if: ${{ steps.find.outputs.new_count > 0 }}
      continue-on-error: true # a Jira outage must never fail the scheduled scan (falls back below)
      shell: bash
      env:
        JIRA_API_TOKEN: ${{ inputs.jira-api-token }}
        JIRA_EMAIL: issue-creation-ohsl8s8d8s@serviceaccount.atlassian.com
        JIRA_CLOUD_ID: ${{ inputs.jira-cloud-id }}
        JIRA_PAYLOAD: ${{ steps.find.outputs.jira_payload }}
      run: |-
        set -euo pipefail

        : "${JIRA_EMAIL:?Jira service-account email must be supplied}"
        : "${JIRA_CLOUD_ID:?Jira Cloud ID must be supplied via jira-cloud-id}"
        API_BASE="https://api.atlassian.com/ex/jira/${JIRA_CLOUD_ID}/rest/api/3"
        SEARCH_URL="${API_BASE}/search/jql"
        API_URL="${API_BASE}/issue"
        SUMMARY="$(jq -er '.fields.summary | strings' <<<"${JIRA_PAYLOAD}")"
        SUMMARY_PREFIX="$(jq -rn --arg summary "${SUMMARY}" '$summary | sub(" [0-9]+ CVE\\(s\\)$"; "")')"
        ESCAPED_SUMMARY="$(jq -rn --arg summary "${SUMMARY_PREFIX}" '$summary | gsub("\\\\"; "\\\\\\\\") | gsub("\""; "\\\"")')"
        JQL="filter = 11525 AND statusCategory in (\"To Do\", \"In Progress\") AND summary ~ \"\\\"${ESCAPED_SUMMARY}\\\"\" ORDER BY updated DESC"

        EXISTING_ISSUE_KEY=''
        NEXT_PAGE_TOKEN=''
        while :; do
          SEARCH_ARGS=(
            --get
            --user "${JIRA_EMAIL}:${JIRA_API_TOKEN}"
            -H 'Accept: application/json'
            --data-urlencode "jql=${JQL}"
            --data-urlencode 'maxResults=100'
            --data-urlencode 'fields=summary,status'
          )
          if [[ -n "${NEXT_PAGE_TOKEN}" ]]; then
            SEARCH_ARGS+=(--data-urlencode "nextPageToken=${NEXT_PAGE_TOKEN}")
          fi

          if ! SEARCH_RESPONSE="$(curl -sS -w '\n%{http_code}' "${SEARCH_ARGS[@]}" "${SEARCH_URL}")"; then
            echo "::notice::Jira lookup unavailable; continuing without a Jira link for ${SUMMARY}"
            exit 0
          fi

          SEARCH_STATUS="$(printf '%s' "${SEARCH_RESPONSE}" | tail -n1)"
          SEARCH_BODY="$(printf '%s' "${SEARCH_RESPONSE}" | sed '$d')"
          if [[ "${SEARCH_STATUS}" != 2[0-9][0-9] ]] || ! jq -e \
            '(.issues | type == "array") and (.isLast | type == "boolean")' \
            <<<"${SEARCH_BODY}" >/dev/null 2>&1; then
            echo "::notice::Jira lookup unavailable (HTTP/${SEARCH_STATUS}); continuing without a Jira link for ${SUMMARY}"
            exit 0
          fi

          EXISTING_ISSUE_KEY="$(
            jq -r \
              --arg summary_prefix "${SUMMARY_PREFIX}" \
              '[
                .issues[]
                | select(
                    .fields.summary as $summary
                    | ($summary | startswith($summary_prefix + " "))
                      and ($summary | endswith(" CVE(s)"))
                  )
                | .key
              ] | first // ""' \
              <<<"${SEARCH_BODY}"
          )"
          IS_LAST="$(jq -er '.isLast | tostring' <<<"${SEARCH_BODY}")"
          if [[ -n "${EXISTING_ISSUE_KEY}" ]] || [[ "${IS_LAST}" == true ]]; then
            break
          fi

          NEXT_PAGE_TOKEN="$(jq -er '.nextPageToken | strings | select(length > 0)' <<<"${SEARCH_BODY}")" || {
            echo "::notice::Jira lookup returned incomplete results; continuing without a Jira link for ${SUMMARY}"
            exit 0
          }
        done

        RESPONSE_BODY='{}'
        HTTP_STATUS_CODE=200
        ISSUE_KEY=''
        if [[ -n "${EXISTING_ISSUE_KEY}" ]]; then
          echo "Reusing Jira issue ${EXISTING_ISSUE_KEY} for the matching repo/package version; skipping creation"
          RESPONSE_BODY="$(jq -cn --arg issue_key "${EXISTING_ISSUE_KEY}" '{created: [{issue_key: $issue_key}]}')"
        else
        CREATE_PAYLOAD="$(jq -c '{fields: .fields}' <<<"${JIRA_PAYLOAD}")"
        RESPONSE="$(curl -sS -w '\n%{http_code}' \
          -X POST \
          --user "${JIRA_EMAIL}:${JIRA_API_TOKEN}" \
          -H 'Accept: application/json' \
          -H 'Content-Type: application/json' \
          -d "${CREATE_PAYLOAD}" \
          "${API_URL}")"

        HTTP_STATUS_CODE="$(printf '%s' "${RESPONSE}" | tail -n1)"
        HTTP_BODY="$(printf '%s' "${RESPONSE}" | sed '$d')"
        ISSUE_KEY="$(jq -r '.key // empty' <<<"${HTTP_BODY}" 2>/dev/null || true)"
        if [[ -n "${ISSUE_KEY}" ]]; then
          RESPONSE_BODY="$(jq -cn --arg issue_key "${ISSUE_KEY}" '{created: [{issue_key: $issue_key}]}')"
        fi
        fi

        {
          echo 'body<<JIRA_API_CREATE_EOF'
          echo "${RESPONSE_BODY}"
          echo 'JIRA_API_CREATE_EOF'
        } >>"${GITHUB_OUTPUT}"

        if [[ -z "${EXISTING_ISSUE_KEY}" && ( "${HTTP_STATUS_CODE}" != 2[0-9][0-9] || -z "${ISSUE_KEY}" ) ]]; then
          echo "::notice::Jira did not return an issue key; continuing without a Jira link for ${SUMMARY}"
        fi

    - name: trivy-notify/jira-watchers
      if: ${{ steps.jira_create.outcome == 'success' && steps.find.outputs.new_count > 0 }}
      continue-on-error: true
      shell: bash
      env:
        JIRA_API_TOKEN: ${{ inputs.jira-api-token }}
        JIRA_EMAIL: issue-creation-ohsl8s8d8s@serviceaccount.atlassian.com
        JIRA_CLOUD_ID: ${{ inputs.jira-cloud-id }}
        JIRA_WATCHERS: ${{ inputs.jira-watchers }}
        JIRA_RESPONSE_BODY: ${{ steps.jira_create.outputs.body }}
      run: |-
        set -euo pipefail

        ISSUE_KEY="$(jq -r '.created[0].issue_key // empty' <<<"${JIRA_RESPONSE_BODY}")"
        [[ -n "${ISSUE_KEY}" ]] || exit 0
        if ! jq -e 'type == "array" and all(.[]; type == "string" and test("^[A-Za-z0-9:_-]+$"))' \
          <<<"${JIRA_WATCHERS:-[]}" >/dev/null 2>&1; then
          echo "::warning::Invalid jira-watchers JSON; expected an array of account IDs. Skipping watchers for ${ISSUE_KEY}"
          exit 0
        fi
        WATCHER_LIST="$(jq -r 'unique[]' <<<"${JIRA_WATCHERS:-[]}")"
        [[ -n "${WATCHER_LIST}" ]] || exit 0
        mapfile -t WATCHER_IDS <<<"${WATCHER_LIST}"
        for ACCOUNT_ID in "${WATCHER_IDS[@]}"; do
          PAYLOAD="$(jq -cn --arg account_id "${ACCOUNT_ID}" '$account_id')"
          if ! HTTP_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST \
            --user "${JIRA_EMAIL}:${JIRA_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "${PAYLOAD}" \
            "https://api.atlassian.com/ex/jira/${JIRA_CLOUD_ID}/rest/api/3/issue/${ISSUE_KEY}/watchers")"; then
            echo "::warning::Jira watcher request failed for ${ACCOUNT_ID} on ${ISSUE_KEY}"
          elif [[ "${HTTP_STATUS}" != 2[0-9][0-9] ]]; then
            echo "::warning::Could not add Jira watcher ${ACCOUNT_ID} to ${ISSUE_KEY} (HTTP/${HTTP_STATUS}); check the configured account ID and Jira response"
          fi
        done

    # ---- Runs after the Jira API call so the ignore-file statement can reference the actual
    #      created issue key (see 'apply-ignorefile.sh' for the response contract). 'always()':
    #      Entries and notifications are still generated if Jira is unavailable. ----
    - name: trivy-notify/apply-ignorefile
      id: apply_ignorefile
      if: ${{ always() && steps.find.outputs.new_count > 0 }}
      shell: bash
      env:
        IGNOREFILE: ${{ steps.find.outputs.ignorefile }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        JIRA_PROJECT: ${{ steps.find.outputs.jira_project }}
        JIRA_TEAM: ${{ steps.find.outputs.jira_team }}
        SLACK_TEXT: ${{ steps.find.outputs.slack_text }}
        JIRA_RESPONSE_BODY: ${{ steps.jira_create.outputs.body }}
      run: ${{ github.action_path }}/apply-ignorefile.sh

    - name: trivy-notify/mint-github-token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0 - https://github.com/actions/create-github-app-token/releases
      id: code_writer_token
      if: >-
        ${{ always() && steps.find.outputs.new_count > 0 &&
        steps.apply_ignorefile.outcome == 'success' &&
        inputs.github-app-client-id != '' && inputs.github-app-private-key != '' }}
      continue-on-error: true
      with:
        client-id: ${{ inputs.github-app-client-id }}
        private-key: ${{ inputs.github-app-private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-contents: write
        permission-pull-requests: write

    - name: trivy-notify/warn-pr-token-unavailable
      if: >-
        ${{ always() && steps.find.outputs.new_count > 0 &&
        steps.apply_ignorefile.outcome == 'success' && steps.code_writer_token.outputs.token == '' }}
      shell: bash
      run: echo "::warning::Could not mint an ik-code-writer token; Trivy suppressions were not opened as a PR"

    - name: trivy-notify/open-ignorefile-pr
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1 - https://github.com/peter-evans/create-pull-request/releases
      id: ignorefile_pr
      if: ${{ always() && steps.code_writer_token.outputs.token != '' }}
      with:
        token: ${{ steps.code_writer_token.outputs.token }}
        branch: automation/trivy-ignorefile
        base: ${{ github.ref_name }}
        title: "ci: suppress ${{ steps.find.outputs.new_count }} new trivy CVE(s) pending remediation"
        body: |-
          Add temporary Trivy ignore entries for newly reported CVEs.

          Jira issue(s): ${{ steps.apply_ignorefile.outputs.created_issue_keys || 'not linked' }}
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          The entries reference confirmed Jira issues or the workflow run and should be removed after remediation or formal risk acceptance.
        commit-message: "ci: suppress ${{ steps.find.outputs.new_count }} new trivy CVE(s) pending remediation"
        add-paths: |-
          ${{ steps.find.outputs.ignorefile }}
          .trivy.yaml
        delete-branch: true

    - name: trivy-notify/enable-auto-merge
      if: ${{ steps.ignorefile_pr.outputs.pull-request-number != '' }}
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ steps.code_writer_token.outputs.token }}
        PR_NUMBER: ${{ steps.ignorefile_pr.outputs.pull-request-number }}
        REPOSITORY: ${{ github.repository }}
      run: |-
        AUTO_MERGE_ALLOWED="$(gh api "repos/${REPOSITORY}" --jq '.allow_auto_merge')"
        if [[ "${AUTO_MERGE_ALLOWED}" == "true" ]]; then
          gh pr merge "${PR_NUMBER}" --auto --squash --repo "${REPOSITORY}"
        else
          echo "::notice::Auto-merge is disabled; review and merge the Trivy suppression PR manually"
        fi

    - name: trivy-notify/warn-slack-token-missing
      if: ${{ always() && steps.find.outputs.new_count > 0 && inputs.slack-bot-token == '' }}
      shell: bash
      run: echo "::warning::Slack notification skipped; pass secrets.SLACK_BOT_TOKEN as slack-bot-token"

    - name: trivy-notify/slack-payload
      id: slack_payload
      if: ${{ always() && steps.find.outputs.new_count > 0 && inputs.slack-bot-token != '' }}
      shell: bash
      env:
        SLACK_CHANNEL: ${{ steps.find.outputs.slack_channel }}
        SLACK_TEXT: ${{ steps.apply_ignorefile.outputs.slack_text || steps.find.outputs.slack_text }}
        PR_URL: ${{ steps.ignorefile_pr.outputs.pull-request-url }}
      run: |-
        PAYLOAD="$(jq -cn --arg channel "${SLACK_CHANNEL}" --arg text "${SLACK_TEXT}" --arg pr_url "${PR_URL}" '
          {channel: $channel, text: ($text + if $pr_url != "" then
            "\nSuppression PR: <" + $pr_url + "|Review and merge>" else
            "\nSuppression PR was not created; check the workflow run." end)}
        ')"
        echo "payload=${PAYLOAD}" >> "${GITHUB_OUTPUT}"

    - name: trivy-notify/slack-notify
      uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0 - https://github.com/slackapi/slack-github-action/releases
      if: ${{ always() && steps.find.outputs.new_count > 0 && steps.slack_payload.outputs.payload != '' && inputs.slack-bot-token != '' }}
      continue-on-error: true
      with:
        token: ${{ inputs.slack-bot-token }}
        method: chat.postMessage
        payload: ${{ steps.slack_payload.outputs.payload }}
